# =====================================================================
# Meu Signo - AAB de PRODUCAO (release) assinado na nuvem do GitHub Actions
# ---------------------------------------------------------------------
# Roda SOMENTE quando voce clica em "Run workflow" (workflow_dispatch).
# NAO roda automaticamente em push, para nao gerar builds de producao sem
# querer.
#
# Assinatura: usa a chave de UPLOAD guardada nos Secrets do repositorio.
#   - O keystore NUNCA fica no repositorio (esta no secret, em base64).
#   - O keystore e descriptografado apenas em memoria/arquivo temporario do
#     runner e removido ao fim.
#   - Nenhuma senha e impressa nos logs (o GitHub ainda mascara os secrets).
#
# Secrets necessarios (cadastrar manualmente em Settings > Secrets > Actions):
#   UPLOAD_KEYSTORE_BASE64   -> keystore (.p12) convertido em base64
#   UPLOAD_KEYSTORE_PASSWORD -> senha do keystore
#   UPLOAD_KEY_ALIAS         -> alias da chave (ex.: upload)
#   UPLOAD_KEY_PASSWORD      -> senha da chave
#
# Gera o artefato "meu-signo-aab-release" (o AAB assinado para a Google Play).
# A pasta docs/ NAO e alterada.
# =====================================================================

name: Build Android AAB release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Gerar AAB de producao (assinado com a chave de upload)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar o Android SDK (command-line tools)
        uses: android-actions/setup-android@v4

      - name: Aceitar licencas e instalar componentes do Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Conferir se os secrets de assinatura existem
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          missing=0
          if [ -z "$KS_B64" ];   then echo "::error::Falta o secret UPLOAD_KEYSTORE_BASE64";   missing=1; fi
          if [ -z "$KS_PASS" ];  then echo "::error::Falta o secret UPLOAD_KEYSTORE_PASSWORD"; missing=1; fi
          if [ -z "$KEY_ALIAS" ]; then echo "::error::Falta o secret UPLOAD_KEY_ALIAS";         missing=1; fi
          if [ -z "$KEY_PASS" ]; then echo "::error::Falta o secret UPLOAD_KEY_PASSWORD";       missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Secrets de assinatura encontrados."

      - name: Instalar dependencias do projeto
        run: npm ci

      - name: Criar o projeto Android do zero e sincronizar
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Fixar versao nativa do play-services-ads (25.4.0)
        run: |
          # O plugin 8.3.0 aceita este override em variables.gradle (rootProject.ext).
          # 25.4.0 e a unica versao 25.4.x publicada no Google Maven: fixar nao
          # muda a resolucao atual, apenas impede uma versao futura inesperada.
          node - <<'NODE'
          const fs = require('fs');
          const path = 'android/variables.gradle';
          const version = '25.4.0';
          const expected = "playServicesAdsVersion = '" + version + "'";
          if (!fs.existsSync(path)) {
            console.error('Falha: android/variables.gradle nao encontrado.');
            process.exit(1);
          }
          let text = fs.readFileSync(path, 'utf8');
          if (!text.includes('playServicesAdsVersion')) {
            text = "ext {\n    " + expected + "\n}\n" + text;
            fs.writeFileSync(path, text);
          }
          const finalText = fs.readFileSync(path, 'utf8');
          const count = (finalText.match(/playServicesAdsVersion\s*=\s*'[^']*'/g) || []).length;
          if (!finalText.includes(expected) || count !== 1) {
            console.error('Falha: pin de play-services-ads ausente ou divergente.');
            process.exit(1);
          }
          console.log('play-services-ads fixado em ' + version + ' no variables.gradle.');
          NODE

      - name: Configurar o App ID do AdMob (somente teste)
        run: |
          # App ID de TESTE oficial do Google. NAO e o App ID real do Meu Signo.
          # Serve apenas para o SDK aceitar a inicializacao nesta fase.
          node - <<'NODE'
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          const name = 'com.google.android.gms.ads.APPLICATION_ID';
          const appId = 'ca-app-pub-3940256099942544~3347511713';
          let xml = fs.readFileSync(path, 'utf8');
          if (xml.includes(name)) {
            console.log('App ID do AdMob ja presente no manifesto.');
          } else {
            const meta = '        <meta-data android:name="' + name + '" android:value="' + appId + '" />\n';
            xml = xml.replace(/(<application\b[^>]*>\s*\n)/, '$1' + meta);
            fs.writeFileSync(path, xml);
          }
          /* O App ID precisa ficar DENTRO de <application>; fora disso o SDK
             falha na inicializacao. Se a verificacao falhar, o build para. */
          const open = xml.indexOf('<application');
          const close = xml.indexOf('</application>');
          const metaAt = xml.indexOf(name);
          const valid = xml.indexOf('<manifest') !== -1
            && xml.indexOf('</manifest>') !== -1
            && open !== -1 && close !== -1
            && open < metaAt && metaAt < close;
          if (!valid) {
            console.error('Falha: App ID do AdMob ausente ou fora de <application>.');
            process.exit(1);
          }
          console.log('App ID do AdMob confirmado dentro de <application>.');
          NODE

      - name: Compilar o AAB de release (sem assinatura do Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Assinar o AAB com a chave de upload
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS_FILE="$RUNNER_TEMP/upload-keystore.p12"
          printf '%s' "$KS_B64" | base64 -d > "$KS_FILE"
          AAB="$(find android/app/build/outputs/bundle -name '*.aab' | head -1)"
          if [ -z "$AAB" ]; then echo "::error::Nenhum AAB encontrado para assinar."; exit 1; fi
          echo "Assinando: $AAB"
          jarsigner \
            -keystore "$KS_FILE" -storetype PKCS12 \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            "$AAB" "$KEY_ALIAS"
          rm -f "$KS_FILE"
          echo "Assinatura aplicada com sucesso."

      - name: Verificar a assinatura do AAB
        run: |
          AAB="$(find android/app/build/outputs/bundle -name '*.aab' | head -1)"
          jarsigner -verify -certs "$AAB" | tail -15

      - name: Registrar o resultado da validacao (sem expor o AAB)
        run: |
          AAB="$(find android/app/build/outputs/bundle -name '*.aab' | head -1)"
          HASH="$(sha256sum "$AAB" | awk '{print $1}')"
          echo "SHA-256 do AAB de release: $HASH"
          {
            echo "### AAB de release assinado (somente validacao)"
            echo ""
            echo "- Arquivo: $(basename "$AAB")"
            echo "- SHA-256 do AAB: \`$HASH\`"
            echo "- Assinatura: chave de upload (jarsigner / JAR signing)"
            echo "- O AAB NAO foi publicado como artefato (repositorio publico)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar o keystore temporario
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.p12" || true
