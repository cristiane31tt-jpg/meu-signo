# =====================================================================
# Meu Signo - Build do Android (.aab) na nuvem do GitHub Actions
# ---------------------------------------------------------------------
# Este fluxo NAO depende de nada instalado no seu computador.
#
# O app usa como conteudo web a propria pasta docs/ (o site ja publicado),
# definida em capacitor.config.json (webDir: "docs"). A pasta docs/ NAO e
# alterada por este workflow.
#
# O que ele faz a cada execucao:
#   1. Baixa o codigo do repositorio.
#   2. Instala Node.js 22, Java 21 e o Android SDK.
#   3. Instala as dependencias do projeto (npm ci).
#   4. Cria o projeto Android DO ZERO (npx cap add android) e sincroniza.
#   5. Compila um .aab.
#   6. Publica o .aab como artefato para download.
#
# ETAPA ATUAL: compilacao de VALIDACAO, SEM assinatura de producao.
#   -> Usa bundleDebug: gera "app-debug.aab" (assinado com a chave de
#      depuracao automatica do Android). Valida a compilacao, mas NAO e
#      enviado para a Google Play.
# =====================================================================

name: Build Android AAB

on:
  # Permite rodar manualmente pelo botao "Run workflow".
  workflow_dispatch:
  # Tambem roda automaticamente a cada envio para a branch principal.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gerar AAB (validacao, sem assinatura de producao)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar o Android SDK (command-line tools)
        uses: android-actions/setup-android@v4

      - name: Aceitar licencas e instalar componentes do Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependencias do projeto
        run: npm ci

      - name: Criar o projeto Android do zero e sincronizar
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Fixar versao nativa do play-services-ads (25.4.0)
        run: |
          # O plugin 8.3.0 aceita este override em variables.gradle (rootProject.ext).
          # 25.4.0 e a unica versao 25.4.x publicada no Google Maven: fixar nao
          # muda a resolucao atual, apenas impede uma versao futura inesperada.
          node - <<'NODE'
          const fs = require('fs');
          const path = 'android/variables.gradle';
          const version = '25.4.0';
          const expected = "playServicesAdsVersion = '" + version + "'";
          if (!fs.existsSync(path)) {
            console.error('Falha: android/variables.gradle nao encontrado.');
            process.exit(1);
          }
          let text = fs.readFileSync(path, 'utf8');
          if (!text.includes('playServicesAdsVersion')) {
            text = "ext {\n    " + expected + "\n}\n" + text;
            fs.writeFileSync(path, text);
          }
          const finalText = fs.readFileSync(path, 'utf8');
          const count = (finalText.match(/playServicesAdsVersion\s*=\s*'[^']*'/g) || []).length;
          if (!finalText.includes(expected) || count !== 1) {
            console.error('Falha: pin de play-services-ads ausente ou divergente.');
            process.exit(1);
          }
          console.log('play-services-ads fixado em ' + version + ' no variables.gradle.');
          NODE

      - name: Configurar o App ID do AdMob (somente teste)
        run: |
          # App ID de TESTE oficial do Google. NAO e o App ID real do Meu Signo.
          # Serve apenas para o SDK aceitar a inicializacao nesta fase.
          node - <<'NODE'
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          const name = 'com.google.android.gms.ads.APPLICATION_ID';
          const appId = 'ca-app-pub-3940256099942544~3347511713';
          let xml = fs.readFileSync(path, 'utf8');
          if (xml.includes(name)) {
            console.log('App ID do AdMob ja presente no manifesto.');
          } else {
            const meta = '        <meta-data android:name="' + name + '" android:value="' + appId + '" />\n';
            xml = xml.replace(/(<application\b[^>]*>\s*\n)/, '$1' + meta);
            fs.writeFileSync(path, xml);
          }
          /* O App ID precisa ficar DENTRO de <application>; fora disso o SDK
             falha na inicializacao. Se a verificacao falhar, o build para. */
          const open = xml.indexOf('<application');
          const close = xml.indexOf('</application>');
          const metaAt = xml.indexOf(name);
          const valid = xml.indexOf('<manifest') !== -1
            && xml.indexOf('</manifest>') !== -1
            && open !== -1 && close !== -1
            && open < metaAt && metaAt < close;
          if (!valid) {
            console.error('Falha: App ID do AdMob ausente ou fora de <application>.');
            process.exit(1);
          }
          console.log('App ID do AdMob confirmado dentro de <application>.');
          NODE

      - name: Compilar o AAB e o APK de validacao (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleDebug assembleDebug --no-daemon --stacktrace

      - name: Mostrar o AAB e o APK gerados
        run: |
          find android/app/build/outputs/bundle -name "*.aab"
          find android/app/build/outputs/apk -name "*.apk"

      - name: Publicar o AAB como artefato para download
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: meu-signo-aab
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publicar o APK como artefato para download
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: meu-signo-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
